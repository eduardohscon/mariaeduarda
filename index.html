<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dff7fb" />
  <meta name="description" content="Convite de aniversário de 2 anos da Maria Eduarda — O Fundo do Mar está em Festa." />
  <meta property="og:title" content="Maria Eduarda — 2 anos" />
  <meta property="og:description" content="O Fundo do Mar está em Festa! 08/11/2026, das 12h às 16h." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/convite-maria-eduarda-2-anos.png" />
  <title>Maria Eduarda — 2 anos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-shell">
    <section class="invite-card" aria-label="Convite de aniversário da Maria Eduarda">
      <img
        src="assets/convite-maria-eduarda-2-anos.png"
        alt="Convite de aniversário de 2 anos da Maria Eduarda com tema Fundo do Mar."
        class="invite-image"
        draggable="false"
      />

      <!-- Áreas clicáveis diretamente sobre a arte -->
      <a
        class="hotspot location-hotspot"
        href="https://maps.app.goo.gl/ujSrrrBSLkHcSrzF8?g_st=iw"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Abrir Casa de Festas Nosso Jardim no Google Maps"
        title="Abrir localização no Google Maps"
      ></a>

      <a
        class="hotspot rsvp-hotspot"
        href="https://wa.me/5521996621302?text=Ol%C3%A1%21%20Gostaria%20de%20confirmar%20minha%20presen%C3%A7a%20no%20anivers%C3%A1rio%20de%202%20anos%20da%20Maria%20Eduarda%20no%20dia%2008%2F11%2F2026."
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Confirmar presença pelo WhatsApp"
        title="Confirmar presença pelo WhatsApp"
      ></a>

      <!-- Bolhas decorativas animadas -->
      <div class="bubbles" aria-hidden="true">
        <span style="--x:8%;--s:14px;--d:8s;--delay:-1s"></span>
        <span style="--x:18%;--s:8px;--d:10s;--delay:-5s"></span>
        <span style="--x:33%;--s:12px;--d:9s;--delay:-3s"></span>
        <span style="--x:51%;--s:7px;--d:11s;--delay:-7s"></span>
        <span style="--x:68%;--s:10px;--d:8.5s;--delay:-4s"></span>
        <span style="--x:82%;--s:15px;--d:12s;--delay:-9s"></span>
        <span style="--x:92%;--s:9px;--d:9.5s;--delay:-6s"></span>
      </div>
    </section>

    <section class="details-card" aria-label="Informações adicionais">
      <p class="gift-title">🎁 Para quem perguntou sobre presentinhos:</p>
      <p>
        roupas <strong>tamanho 3 anos</strong>, sapatinhos <strong>nº 21</strong>
        e brinquedos serão muito bem-vindos.
      </p>

      <p class="closing-message">
        Esperamos vocês para mergulhar nessa festa com a gente! 🫧🐚
      </p>

      <div class="inline-links">
        <a
          href="https://maps.app.goo.gl/ujSrrrBSLkHcSrzF8?g_st=iw"
          target="_blank"
          rel="noopener noreferrer"
        >
          📍 Casa de Festas Nosso Jardim
        </a>

        <a
          href="https://wa.me/5521996621302?text=Ol%C3%A1%21%20Gostaria%20de%20confirmar%20minha%20presen%C3%A7a%20no%20anivers%C3%A1rio%20de%202%20anos%20da%20Maria%20Eduarda%20no%20dia%2008%2F11%2F2026."
          target="_blank"
          rel="noopener noreferrer"
        >
          💬 WhatsApp: (21) 99662-1302
        </a>
      </div>
    </section>

    <!-- No desktop aparece no fluxo; no mobile fica sempre visível na parte inferior -->
    <nav class="quick-actions" aria-label="Ações rápidas do convite">
      <a
        class="action-button"
        href="https://wa.me/5521996621302?text=Ol%C3%A1%21%20Gostaria%20de%20confirmar%20minha%20presen%C3%A7a%20no%20anivers%C3%A1rio%20de%202%20anos%20da%20Maria%20Eduarda%20no%20dia%2008%2F11%2F2026."
        target="_blank"
        rel="noopener noreferrer"
      >
        <span aria-hidden="true">✓</span>
        Confirmar presença
      </a>
      <a
        class="action-button secondary"
        href="https://maps.app.goo.gl/ujSrrrBSLkHcSrzF8?g_st=iw"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span aria-hidden="true">⌖</span>
        Localização
      </a>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
